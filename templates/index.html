<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIR Crime Detection System</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🔍 FIR Crime Classification &amp; Hotspot Detection</h1>
            <p>File a complaint and visualize crime hotspots on the map</p>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="left-panel">
                <div class="card form-card">
                    <h2>📝 File a Complaint</h2>
                    <form id="fir-form">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="age">Age</label>
                                <input type="number" id="age" name="age" min="1" max="120" placeholder="Age" required>
                            </div>
                            <div class="form-group">
                                <label for="gender">Gender</label>
                                <select id="gender" name="gender" required>
                                    <option value="">Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="complaint">Complaint Details</label>
                            <textarea id="complaint" name="complaint" rows="4"
                                placeholder="Describe the incident in detail..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Address (Click on the map to select location)</label>
                            <div class="coords-display">
                                <div class="coord-field">
                                    <label for="latitude">Latitude</label>
                                    <input type="text" id="latitude" name="latitude" readonly
                                        placeholder="Click on map">
                                </div>
                                <div class="coord-field">
                                    <label for="longitude">Longitude</label>
                                    <input type="text" id="longitude" name="longitude" readonly
                                        placeholder="Click on map">
                                </div>
                            </div>
                            <p class="hint">👆 Click anywhere on the map to select your address location</p>
                        </div>

                        <button type="submit" id="submit-btn">
                            <span class="btn-text">Submit Complaint</span>
                            <span class="btn-loading" style="display:none;">Processing...</span>
                        </button>
                    </form>
                </div>

                <div class="card result-card" id="result-card" style="display:none;">
                    <h2>📋 FIR Result</h2>
                    <div id="result-content"></div>
                </div>

                <div class="card stats-card">
                    <h2>📊 Crime Statistics</h2>
                    <div id="stats-content">
                        <p>Loading statistics...</p>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="card map-card">
                    <div class="map-header">
                        <h2>🗺️ Crime Hotspot Map</h2>
                        <div class="map-controls">
                            <select id="crime-filter">
                                <option value="All">All Crime Types</option>
                            </select>
                        </div>
                    </div>
                    <div id="map"></div>
                    <div class="map-legend" id="map-legend"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
