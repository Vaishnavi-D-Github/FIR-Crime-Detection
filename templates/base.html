<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Citizen FIR Intelligence Portal{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <div class="nav-content">
            <a href="/" class="nav-brand">
                <span class="brand-icon" aria-hidden="true">&#128737;</span>
                <span>Citizen FIR Portal</span>
            </a>
            <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
            </button>
            <div class="nav-links" id="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/police/login" class="nav-link">Police Portal</a>
                {% if user %}
                    <a href="/dashboard" class="nav-link">Dashboard</a>
                    <span class="nav-user">{{ user.name }}</span>
                    <a href="/logout" class="nav-link btn-nav-outline">Logout</a>
                {% else %}
                    <a href="/login" class="nav-link">Login</a>
                    <a href="/register" class="nav-link btn-nav-filled">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
    <script src="/static/js/ui.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
